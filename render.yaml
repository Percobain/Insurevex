# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: insurevex-api
    runtime: node
    region: singapore
    plan: starter
    rootDir: server
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    numInstances: 1
    autoDeployTrigger: "off"
    disk:
      name: insurevex-state
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: CLIENT_ORIGIN
        sync: false
      - key: QUOTER_PRIVATE_KEY
        sync: false
      - key: KEEPER_SECRET
        generateValue: true
      # Enable only after handing off from the local keeper (see docs/RENDER.md).
      - key: KEEPER
        value: "0"
      - key: STORE_FILE
        value: /var/data/store.json
      - key: PRICE_CACHE_FILE
        value: /var/data/price-cache.json
      - key: AGENT_STATE_DIR
        value: /var/data/agent
      - key: AGENT_POLICY_FILE
        value: /var/data/agent/policy.json
      - key: AGENT_KILL_FILE
        value: /var/data/agent/STOP
      - key: X402_STATE_FILE
        value: /var/data/merchant.sqlite
      # Enable after migrating wallet, policy AND payment databases to the disk.
      - key: X402_ENABLED
        value: "0"
      - key: AGENT_KILL_SWITCH
        value: "1"
